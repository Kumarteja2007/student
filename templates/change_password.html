<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h2>🔒 Change Password</h2>

        {% if message %}
        <p class="message">{{ message }}</p>
        {% endif %}

        <form action="/change-password" method="post">

            <input
                type="hidden"
                name="username"
                value="{{username}}"
            >

            <label>Current Password</label>

            <input
                type="password"
                name="current_password"
                required
            >

            <label>New Password</label>

            <input
                type="password"
                name="new_password"
                required
            >

            <label>Confirm New Password</label>

            <input
                type="password"
                name="confirm_password"
                required
            >

            <button type="submit">

                Change Password

            </button>

        </form>

        <br>

        <a href="/student-dashboard/{{username}}">
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>

</html>
