<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Faculty Login</h2>
            {% if message %}
            <div class="error-message">
                ❌ {{ message }}
            </div>
            {% endif %}
            <form action="/faculty-login" method="post">
                <label>Faculty Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    required
                >
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >
                <button type="submit">
                    Login
                </button>
            </form>
            <br>
            <a href="/">
                ← Back to Home
            </a>
        </div>
    </div>
</body>
</html>
