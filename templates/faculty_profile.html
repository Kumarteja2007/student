<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty Profile</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">

    <h2>Faculty Profile</h2>

    <form action="/update-faculty-profile" method="post">

        <input
            type="hidden"
            name="username"
            value="{{ faculty.username }}"
        >

        <label>Faculty ID</label>

        <input
            type="text"
            value="{{ faculty.faculty_id }}"
            readonly
        >

        <label>Username</label>

        <input
            type="text"
            value="{{ faculty.username }}"
            readonly
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            value="{{ faculty.email }}"
            required
        >

        <label>Full Name</label>

        <input
            type="text"
            name="full_name"
            value="{{ faculty.full_name or '' }}"
            required
        >

        <label>Mobile Number</label>

        <input
            type="text"
            name="mobile"
            value="{{ faculty.mobile or '' }}"
            required
        >

        <label>Department</label>

        <input
            type="text"
            value="{{ faculty.department }}"
            readonly
        >

        <label>Designation</label>

        <input
            type="text"
            value="{{ faculty.designation }}"
            readonly
        >
        <button type="submit">
            Save Profile
        </button>
    </form>
    <br>
    <a href="/faculty-dashboard/{{ username }}">
        <button type="button">
            ← Back to Dashboard
        </button>
    </a>
</div>
</body>
</html>
