<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <form action="/reset-password" method="post">

        <input
            type="hidden"
            name="username"
            value="{{ username }}">

        <input
            type="hidden"
            name="email"
            value="{{ email }}">

        <input
            type="password"
            name="new_password"
            placeholder="New Password"
            required>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required>

        <button type="submit">
            Update Password
        </button>

    </form>

</div>

</body>
</html>
